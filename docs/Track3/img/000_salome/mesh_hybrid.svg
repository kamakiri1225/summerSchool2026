<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" font-family="sans-serif">
  <rect x="0" y="0" width="320" height="220" fill="#ffffff"/>
  <!-- left: structured hex grid, right: unstructured tetra-like triangles -->
  <g stroke="#1f3a5f" stroke-width="1.2">
    <!-- hex (quad) grid, left half -->
    <g fill="#dce6f2" fill-opacity="0.7">
      <rect x="40" y="60" width="30" height="26"/>
      <rect x="70" y="60" width="30" height="26"/>
      <rect x="40" y="86" width="30" height="26"/>
      <rect x="70" y="86" width="30" height="26"/>
      <rect x="40" y="112" width="30" height="26"/>
      <rect x="70" y="112" width="30" height="26"/>
    </g>
    <!-- transition / unstructured triangles, right half -->
    <g fill="#eef3fa" fill-opacity="0.8">
      <polygon points="100,60 150,60 130,86"/>
      <polygon points="100,60 130,86 100,86"/>
      <polygon points="150,60 190,72 130,86"/>
      <polygon points="130,86 190,72 165,112"/>
      <polygon points="100,86 130,86 165,112"/>
      <polygon points="100,86 165,112 110,138"/>
      <polygon points="100,86 110,138 100,112"/>
      <polygon points="190,72 240,90 165,112"/>
      <polygon points="165,112 240,90 200,140"/>
      <polygon points="165,112 200,140 110,138"/>
    </g>
  </g>
  <line x1="100" y1="55" x2="100" y2="145" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="70" y="170" text-anchor="middle" font-size="14" fill="#1f3a5f">六面体</text>
  <text x="190" y="170" text-anchor="middle" font-size="14" fill="#1f3a5f">四面体</text>
  <text x="160" y="200" text-anchor="middle" font-size="16" fill="#1f3a5f">ヘキサ＋テトラの混在</text>
</svg>
