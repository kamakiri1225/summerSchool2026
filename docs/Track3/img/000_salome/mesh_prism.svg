<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" font-family="sans-serif">
  <rect x="0" y="0" width="320" height="220" fill="#ffffff"/>
  <!-- boundary layer prism stack next to a wall -->
  <g stroke="#1f3a5f" stroke-width="1.5">
    <!-- stacked thin layers, growing thicker away from the wall -->
    <rect x="50" y="150" width="220" height="10" fill="#eef3fa" fill-opacity="0.9"/>
    <rect x="50" y="132" width="220" height="14" fill="#e2eaf5" fill-opacity="0.9"/>
    <rect x="50" y="108" width="220" height="20" fill="#d6e0f0" fill-opacity="0.9"/>
    <rect x="50" y="78" width="220" height="26" fill="#c9d7ec" fill-opacity="0.9"/>
    <!-- vertical divider lines to show cell columns -->
    <line x1="90" y1="78" x2="90" y2="160" stroke-width="1"/>
    <line x1="130" y1="78" x2="130" y2="160" stroke-width="1"/>
    <line x1="170" y1="78" x2="170" y2="160" stroke-width="1"/>
    <line x1="210" y1="78" x2="210" y2="160" stroke-width="1"/>
    <line x1="250" y1="78" x2="250" y2="160" stroke-width="1"/>
  </g>
  <!-- wall -->
  <rect x="45" y="160" width="230" height="8" fill="#1f3a5f"/>
  <text x="160" y="195" text-anchor="middle" font-size="16" fill="#1f3a5f">壁面付近に層状に生成</text>
  <text x="30" y="167" text-anchor="end" font-size="13" fill="#1f3a5f">壁面</text>
</svg>
