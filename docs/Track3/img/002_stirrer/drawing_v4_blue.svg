<svg xmlns="http://www.w3.org/2000/svg" width="410" height="530" viewBox="0 0 410 530">
  <defs>
    <marker id="arrEnd" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,0 9,3.5 0,7" fill="#000"/>
    </marker>
    <marker id="arrStart" markerWidth="9" markerHeight="7" refX="0" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="9,0 0,3.5 9,7" fill="#000"/>
    </marker>
    <marker id="arrBE" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,0 9,3.5 0,7" fill="#1560d8"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="7" refX="0" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="9,0 0,3.5 9,7" fill="#1560d8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="410" height="530" fill="#ffffff"/>

  <g stroke="#000000" fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- ===== 補助線（寸法補助線） ===== -->
    <g stroke-width="0.8">
      <!-- 右 110 -->
      <line x1="262" y1="50"  x2="376" y2="50"/>
      <line x1="262" y1="380" x2="376" y2="380"/>
      <!-- 青線用 -->
      <line x1="262" y1="350" x2="286" y2="350"/>
      <line x1="262" y1="320" x2="306" y2="320"/>
      <line x1="262" y1="290" x2="326" y2="290"/>
      <line x1="262" y1="260" x2="346" y2="260"/>
      <!-- 下側 10 / 15 / 25 / 35 / 40 -->
      <line x1="140" y1="382" x2="140" y2="500"/>
      <line x1="170" y1="382" x2="170" y2="404"/>
      <line x1="185" y1="382" x2="185" y2="428"/>
      <line x1="215" y1="382" x2="215" y2="452"/>
      <line x1="245" y1="382" x2="245" y2="476"/>
      <line x1="260" y1="382" x2="260" y2="500"/>
      <!-- 左 35 -->
      <line x1="147" y1="275" x2="54"  y2="275"/>
      <line x1="138" y1="380" x2="54"  y2="380"/>
      <!-- 左 15 -->
      <line x1="147" y1="335" x2="94"  y2="335"/>
      <!-- 上部 3 -->
      <line x1="140" y1="333" x2="140" y2="222"/>
      <line x1="149" y1="240" x2="149" y2="222"/>
    </g>

    <!-- ===== 寸法線 ===== -->
    <g stroke-width="1">
      <line x1="370" y1="50"  x2="370" y2="380" marker-start="url(#arrStart)" marker-end="url(#arrEnd)"/>
      <line x1="140" y1="398" x2="170" y2="398" marker-start="url(#arrStart)" marker-end="url(#arrEnd)"/>
      <line x1="140" y1="422" x2="185" y2="422" marker-start="url(#arrStart)" marker-end="url(#arrEnd)"/>
      <line x1="140" y1="446" x2="215" y2="446" marker-start="url(#arrStart)" marker-end="url(#arrEnd)"/>
      <line x1="140" y1="470" x2="245" y2="470" marker-start="url(#arrStart)" marker-end="url(#arrEnd)"/>
      <line x1="140" y1="494" x2="260" y2="494" marker-start="url(#arrStart)" marker-end="url(#arrEnd)"/>
      <line x1="60"  y1="275" x2="60"  y2="380" marker-start="url(#arrStart)" marker-end="url(#arrEnd)"/>
      <line x1="100" y1="335" x2="100" y2="380" marker-start="url(#arrStart)" marker-end="url(#arrEnd)"/>
      <!-- 3（狭いので矢印は外向き） -->
      <line x1="118" y1="232" x2="140" y2="232" marker-end="url(#arrEnd)"/>
      <line x1="171" y1="232" x2="149" y2="232" marker-end="url(#arrEnd)"/>
    </g>

    <!-- ===== 追加寸法（青） ===== -->
    <g stroke-width="1" stroke="#1560d8">
      <line x1="280" y1="350" x2="280" y2="380" marker-start="url(#arrB)" marker-end="url(#arrBE)"/>
      <line x1="300" y1="320" x2="300" y2="380" marker-start="url(#arrB)" marker-end="url(#arrBE)"/>
      <line x1="320" y1="290" x2="320" y2="380" marker-start="url(#arrB)" marker-end="url(#arrBE)"/>
      <line x1="340" y1="260" x2="340" y2="380" marker-start="url(#arrB)" marker-end="url(#arrBE)"/>
    </g>

    <!-- ===== 図形（外形・内部線） ===== -->
    <g stroke-width="2.4">
      <!-- 外形 -->
      <path d="M 140 380 L 260 380 L 260 50 L 149 50 L 149 335 L 140 335 Z"/>
      <!-- 内部の水平線 -->
      <line x1="149" y1="275" x2="260" y2="275"/>
      <line x1="149" y1="335" x2="260" y2="335"/>
      <!-- 内部の垂直線（色付け） -->
      <g stroke="#e01b1b">
        <line x1="170" y1="50"  x2="170" y2="380"/>
        <line x1="185" y1="50"  x2="185" y2="380"/>
        <line x1="215" y1="50"  x2="215" y2="380"/>
        <line x1="245" y1="50"  x2="245" y2="380"/>
        <line x1="149" y1="335" x2="149" y2="380"/>
      </g>
      <!-- 追加した横線（Dz = 10 / 20 / 30 / 40） -->
      <g stroke="#1560d8">
        <line x1="140" y1="350" x2="260" y2="350"/>
        <line x1="149" y1="320" x2="260" y2="320"/>
        <line x1="149" y1="290" x2="260" y2="290"/>
        <line x1="149" y1="260" x2="260" y2="260"/>
      </g>
    </g>
  </g>

  <!-- ===== 原点 ===== -->
  <g stroke="#000000" stroke-width="1.2">
    <line x1="132" y1="380" x2="148" y2="380"/>
    <line x1="140" y1="372" x2="140" y2="388"/>
  </g>
  <circle cx="140" cy="380" r="3.2" fill="none" stroke="#000000" stroke-width="1.2"/>

  <!-- ===== 寸法文字 ===== -->
  <g fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle">
    <text x="155" y="393">10</text>
    <text x="162" y="417">15</text>
    <text x="177" y="441">25</text>
    <text x="192" y="465">35</text>
    <text x="200" y="489">40</text>
    <text x="112" y="237" text-anchor="end">3</text>
    <text x="386" y="215" transform="rotate(-90 386 215)">110</text>
    <text x="52"  y="327" transform="rotate(-90 52 327)">35</text>
    <text x="92"  y="357" transform="rotate(-90 92 357)">15</text>
  </g>
  <g fill="#1560d8" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle">
    <text x="274" y="365" transform="rotate(-90 274 365)">10</text>
    <text x="294" y="350" transform="rotate(-90 294 350)">20</text>
    <text x="314" y="335" transform="rotate(-90 314 335)">30</text>
    <text x="334" y="320" transform="rotate(-90 334 320)">40</text>
  </g>
</svg>
